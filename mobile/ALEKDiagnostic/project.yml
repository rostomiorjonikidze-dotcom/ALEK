name: ALEKDiagnosticMobile
options:
  bundleIdPrefix: best.alek
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  ALEKDiagnosticMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: best.alek.diagnosticmobile
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ALEK Diagnostic
        NSBluetoothAlwaysUsageDescription: "Bluetooth is needed to connect to your ELM327 BLE diagnostic adapter."
        NSBluetoothPeripheralUsageDescription: "Bluetooth is needed to connect to your ELM327 BLE diagnostic adapter."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
