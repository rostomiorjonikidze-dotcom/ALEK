<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#07111f"/>
  <title>ALEK Arena</title>
  <link rel="manifest" href="./manifest.json"/>
  <link rel="stylesheet" href="./styles.css"/>
  <link rel="stylesheet" href="./game/game.css"/>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div><div class="eyebrow">ALEK ECOSYSTEM</div><h1>ALEK ARENA</h1></div>
      <button class="energy-pill" id="profileTop">⚡ <strong id="energyTop">20</strong><span>/20</span></button>
    </header>
    <main id="app"></main>
    <nav class="bottom-nav">
      <button data-route="home" class="nav-btn active"><span>⌂</span><small>Home</small></button>
      <button data-route="missions" class="nav-btn"><span>◎</span><small>Missions</small></button>
      <button data-route="arena" class="nav-btn"><span>⚔</span><small>Arena</small></button>
      <button data-route="friends" class="nav-btn"><span>♟</span><small>Friends</small></button>
      <button data-route="shop" class="nav-btn"><span>◇</span><small>Shop</small></button>
    </nav>
  </div>
  <div id="toast" class="toast"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
