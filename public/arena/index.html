<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <title>ALEK World</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">ALEK ECOSYSTEM</div>
        <h1>ALEK WORLD</h1>
      </div>
      <div class="status-pill">⚡ <span id="energy">20</span>/20</div>
    </header>

    <main id="app"></main>

    <nav class="bottom-nav">
      <button data-route="home" class="nav-btn active"><span>⌂</span><small>Home</small></button>
      <button data-route="world" class="nav-btn"><span>🌍</span><small>World</small></button>
      <button data-route="missions" class="nav-btn"><span>◎</span><small>Missions</small></button>
      <button data-route="friends" class="nav-btn"><span>♟</span><small>Friends</small></button>
      <button data-route="shop" class="nav-btn"><span>◇</span><small>Shop</small></button>
    </nav>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
