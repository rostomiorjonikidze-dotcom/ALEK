<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OKX Wallet Integration</title>
    <!-- Ethers.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js" type="text/javascript"></script>
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #181a20;
            --text-color: #ffffff;
            --accent-color: #2b5cff;
            --accent-hover: #1d4ed8;
            --border-color: #2a2d35;
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        p {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .wallet-card {
            background-color: #000000;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .wallet-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .info-label {
            color: #6b7280;
        }

        .info-value {
            font-weight: 600;
            font-family: monospace;
        }

        .btn {
            background-color: var(--text-color);
            color: #000000;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn:disabled {
            background-color: #374151;
            color: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-disconnected {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
        }

        .status-connected {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
        }

        .okx-logo {
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: black;
            font-size: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>OKX Wallet Integration</h1>
        <p>დააკავშირეთ თქვენი OKX საფულე საიტთან</p>

        <div class="wallet-card">
            <div class="wallet-info">
                <div class="info-row">
                    <span class="info-label">სტატუსი:</span>
                    <span id="statusBadge" class="status-badge status-disconnected">გათიშულია</span>
                </div>
                <div class="info-row">
                    <span class="info-label">მისამართი:</span>
                    <span id="walletAddress" class="info-value">---</span>
                </div>
                <div class="info-row">
                    <span class="info-label">ბალანსი:</span>
                    <span id="walletBalance" class="info-value">---</span>
                </div>
            </div>
        </div>

        <button id="connectBtn" class="btn" onclick="connectOKXWallet()">
            <div class="okx-logo">OKX</div>
            <span>Connect OKX Wallet</span>
        </button>
    </div>

    <script>
        let provider;
        let signer;

        async function connectOKXWallet() {
            const connectBtn = document.getElementById('connectBtn');
            const statusBadge = document.getElementById('statusBadge');
            const walletAddress = document.getElementById('walletAddress');
            const walletBalance = document.getElementById('walletBalance');

            // 1. შემოწმება: დაინსტალირებულია თუ არა OKX Wallet
            if (typeof window.okxwallet === 'undefined') {
                alert('OKX Wallet არ არის დაინსტალირებული! გთხოვთ დააინსტალიროთ OKX გაფართოება.');
                window.open('https://www.okx.com/web3', '_blank');
                return;
            }

            try {
                connectBtn.disabled = true;
                connectBtn.innerText = 'მიმდინარეობს დაკავშირება...';

                // 2. წვდომის მოთხოვნა საფულესთან
                const accounts = await window.okxwallet.request({ method: 'eth_requestAccounts' });
                const account = accounts[0];

                // 3. Ethers.js პროვაიდერის ინიციალიზაცია OKX-ის მეშვეობით
                provider = new ethers.providers.Web3Provider(window.okxwallet);
                signer = provider.getSigner();

                // 4. ბალანსის მიღება
                const balanceWei = await provider.getBalance(account);
                const balanceEth = ethers.utils.formatEther(balanceWei);

                // 5. UI განახლება
                const shortAddress = `${account.substring(0, 6)}...${account.substring(account.length - 4)}`;
                walletAddress.innerText = shortAddress;
                walletAddress.title = account; // სრული მისამართი hover-ზე
                walletBalance.innerText = `${parseFloat(balanceEth).toFixed(4)} ETH`;

                statusBadge.innerText = 'დაკავშირებულია';
                statusBadge.className = 'status-badge status-connected';

                connectBtn.innerText = 'საფულე დაკავშირებულია';
                
                // ანგარიშის ცვლილების მოსმენა
                window.okxwallet.on('accountsChanged', (newAccounts) => {
                    if (newAccounts.length === 0) {
                        resetUI();
                    } else {
                        connectOKXWallet();
                    }
                });

                // ქსელის ცვლილების მოსმენა
                window.okxwallet.on('chainChanged', () => {
                    window.location.reload();
                });

            } catch (error) {
                console.error('OKX Wallet დაკავშირების შეცდომა:', error);
                alert('საფულესთან დაკავშირება ვერ მოხერხდა: ' + (error.message || error));
                resetUI();
            }
        }

        function resetUI() {
            document.getElementById('statusBadge').innerText = 'გათიშულია';
            document.getElementById('statusBadge').className = 'status-badge status-disconnected';
            document.getElementById('walletAddress').innerText = '---';
            document.getElementById('walletBalance').innerText = '---';
            const connectBtn = document.getElementById('connectBtn');
            connectBtn.disabled = false;
            connectBtn.innerHTML = '<div class="okx-logo">OKX</div><span>Connect OKX Wallet</span>';
        }
    </script>
</body>
</html>
