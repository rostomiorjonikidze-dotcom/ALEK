name: ALEK Diagnostic iOS build
on:
  push:
    branches:
      - feature/alek-diagnostic-elm327-ios
  workflow_dispatch:

concurrency:
  group: diagnostic-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: mobile/ALEKDiagnostic
        run: xcodegen generate
      - name: Build unsigned iPhone Simulator app
        working-directory: mobile/ALEKDiagnostic
        run: |
          xcodebuild -project ALEKDiagnosticMobile.xcodeproj \
            -scheme ALEKDiagnosticMobile \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Run parser unit tests
        working-directory: mobile/ALEKDiagnostic
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); devices=[x for v in d["devices"].values() for x in v if "iPhone" in x.get("name","") and x.get("isAvailable",False)]; print(devices[0]["udid"] if devices else "")')
          if [ -z "$SIM_ID" ]; then
            echo "No available iPhone simulator"; exit 1
          fi
          xcodebuild -project ALEKDiagnosticMobile.xcodeproj \
            -scheme ALEKDiagnosticMobile \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO test
      - name: Package verified Xcode project
        if: success()
        run: |
          cd mobile/ALEKDiagnostic
          zip -qr ../../ALEK-DIAGNOSTIC-MOBILE-XCODE.zip .
      - name: Upload complete Xcode project
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ALEK-DIAGNOSTIC-MOBILE-XCODE
          path: ALEK-DIAGNOSTIC-MOBILE-XCODE.zip
          retention-days: 30
