name: ALEK Signals
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alek-signals.yml'
      - 'alek-signal/bot.py'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      telegram_test:
        description: 'Send Telegram connectivity test (not a trading signal)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: alek-signals-state
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Restore sent-signal state
        uses: actions/cache/restore@v4
        with:
          path: alek-signal/signal-state.json
          key: alek-signal-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            alek-signal-state-
      - name: Install chart dependency
        run: python3 -m pip install --disable-pip-version-check matplotlib==3.10.7
      - name: Check Telegram connection or scan markets
        run: python3 alek-signal/bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TELEGRAM_TEST: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[telegram-test]')) || (github.event_name == 'workflow_dispatch' && inputs.telegram_test == true) }}
      - name: Save sent-signal state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: alek-signal/signal-state.json
          key: alek-signal-state-${{ github.run_id }}-${{ github.run_attempt }}
