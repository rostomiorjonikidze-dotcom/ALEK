name: ALEK Signals
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      telegram_test:
        description: 'Send Telegram connectivity test (not a trading signal)'
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python alek-signal/bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TELEGRAM_TEST: ${{ inputs.telegram_test || 'false' }}
