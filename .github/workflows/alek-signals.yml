name: ALEK Signals
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alek-signals.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      telegram_test:
        description: 'Send Telegram connectivity test (not a trading signal)'
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check Python
        run: python3 --version
      - name: Check Telegram connection or scan markets
        run: python3 alek-signal/bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TELEGRAM_TEST: ${{ github.event_name == 'push' || inputs.telegram_test == true }}
