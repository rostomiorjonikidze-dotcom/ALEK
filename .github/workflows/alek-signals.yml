name: ALEK Signals
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alek-signals.yml'
      - 'alek-signal/bot.py'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: BTCUSDT
            delay: 0
          - asset: XAUUSD
            delay: 60
          - asset: ETHUSDT
            delay: 120
          - asset: SOLUSDT
            delay: 180
          - asset: WTI
            delay: 240
    concurrency:
      group: signal-history-${{ matrix.asset }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Offset this market within the five-minute cycle
        run: sleep ${{ matrix.delay }}
      - name: Install chart dependency
        if: matrix.asset != 'XAUUSD' && matrix.asset != 'WTI'
        run: python3 -m pip install --disable-pip-version-check matplotlib==3.10.7
      - name: Restore sent-signal history
        uses: actions/cache/restore@v4
        with:
          path: alek-signal/signal-state.json
          key: signal-history-${{ matrix.asset }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            signal-history-${{ matrix.asset }}-
      - name: Scan independent futures market
        run: python3 alek-signal/bot.py
        env:
          SIGNAL_ASSET: ${{ matrix.asset }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TELEGRAM_TEST: 'false'
      - name: Save sent-signal history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: alek-signal/signal-state.json
          key: signal-history-${{ matrix.asset }}-${{ github.run_id }}-${{ github.run_attempt }}
